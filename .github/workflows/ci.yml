name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, same pin as Flow
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix e2e ci
      - run: scripts/gates.sh web
      - run: scripts/gates.sh e2e

  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Require reviewed lockfile
        run: test -s Cargo.lock
      - name: Install declared Rust toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy llvm-tools-preview
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      # Repository checks only read npm manifests/locks; no npm installation is needed.
      - run: scripts/gates.sh server
      - run: scripts/gates.sh coverage

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: test -s Cargo.lock
      - run: rustup show
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: scripts/gates.sh security

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: test -s Cargo.lock
      - run: npm --prefix e2e ci
      - run: npm --prefix e2e exec -- playwright install --with-deps chromium
      - run: docker compose up --build -d
      - name: Wait for actual service readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then exit 0; fi
            sleep 1
          done
          docker compose logs app
          exit 1
      - run: scripts/gates.sh browser
      - name: Verify deterministic pickups using the same built image
        run: |
          docker compose -f docker-compose.yaml -f docker-compose.pickups.yaml up -d --no-build --force-recreate app
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_PICKUP_FIXTURE=arena-v1-pickups npm --prefix e2e run test:pickups
      - name: Verify Heart pickup and protection using the same built image
        run: |
          chmod 444 core/tests/fixtures/arena-v2-heart.seed
          docker compose -f docker-compose.yaml -f docker-compose.heart.yaml up -d --no-build --force-recreate app
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_HEART_FIXTURE=arena-v2-heart npm --prefix e2e run test:heart
      - name: Verify opt-in Shield pickup and exact expiry using the same built image
        run: |
          chmod 444 core/tests/fixtures/arena-v2-shield.seed
          docker compose -f docker-compose.yaml -f docker-compose.shield.yaml up -d --no-build --force-recreate app
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_SHIELD_FIXTURE=arena-v2-shield npm --prefix e2e run test:shield
      - name: Verify opt-in Golden Flame range and exact expiry using the same built image
        run: |
          chmod 444 core/tests/fixtures/arena-v2-golden-flame.seed
          docker compose -f docker-compose.yaml -f docker-compose.golden-flame.yaml up -d --no-build --force-recreate app
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_GOLDEN_FLAME_FIXTURE=arena-v2-golden-flame npm --prefix e2e run test:golden-flame
      - name: Verify opt-in Short Fuse timing and exact expiry using the same built image
        run: |
          chmod 444 core/tests/fixtures/arena-v2-short-fuse.seed
          docker compose -f docker-compose.yaml -f docker-compose.short-fuse.yaml up -d --no-build --force-recreate app
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_SHORT_FUSE_FIXTURE=arena-v2-short-fuse npm --prefix e2e run test:short-fuse
      - name: Verify opt-in Short Flame range and exact expiry using the same built image
        run: |
          chmod 444 core/tests/fixtures/arena-v2-short-flame.seed
          docker compose -f docker-compose.yaml -f docker-compose.short-flame.yaml up -d --no-build --force-recreate app
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_SHORT_FLAME_FIXTURE=arena-v2-short-flame npm --prefix e2e run test:short-flame
      - name: Verify opt-in Long Fuse timing and exact expiry using the same built image
        run: |
          chmod 444 core/tests/fixtures/arena-v2-long-fuse.seed
          docker compose -f docker-compose.yaml -f docker-compose.long-fuse.yaml up -d --no-build --force-recreate app
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_LONG_FUSE_FIXTURE=arena-v2-long-fuse npm --prefix e2e run test:long-fuse
      - name: Verify opt-in Reverse Controls inversion and exact expiry using the same built image
        run: |
          chmod 444 core/tests/fixtures/arena-v2-reverse-controls.seed
          docker compose -f docker-compose.yaml -f docker-compose.reverse-controls.yaml up -d --no-build --force-recreate app
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_REVERSE_CONTROLS_FIXTURE=arena-v2-reverse-controls npm --prefix e2e run test:reverse-controls
      - name: Verify opt-in Diarrhea automatic bomb placement using the same built image
        run: |
          chmod 444 core/tests/fixtures/arena-v2-diarrhea.seed
          docker compose -f docker-compose.yaml -f docker-compose.diarrhea.yaml up -d --no-build --force-recreate app
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_DIARRHEA_FIXTURE=arena-v2-diarrhea npm --prefix e2e run test:diarrhea
      - name: Verify opt-in Slow foot movement and exact expiry using the same built image
        run: |
          chmod 444 core/tests/fixtures/arena-v2-slow-foot.seed
          docker compose -f docker-compose.yaml -f docker-compose.slow-foot.yaml up -d --no-build --force-recreate app
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_SLOW_FOOT_FIXTURE=arena-v2-slow-foot npm --prefix e2e run test:slow-foot
      - name: Verify opt-in Piercing Bomb penetration using the same built image
        run: |
          chmod 444 core/tests/fixtures/arena-v2-piercing-bomb.seed
          docker compose -f docker-compose.yaml -f docker-compose.piercing-bomb.yaml up -d --no-build --force-recreate app
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_PIERCING_BOMB_FIXTURE=arena-v2-piercing-bomb npm --prefix e2e run test:piercing-bomb
      - name: Verify opt-in Power Bomb hard-wall traversal using the same built image
        run: |
          chmod 444 core/tests/fixtures/arena-v2-power-bomb.seed
          docker compose -f docker-compose.yaml -f docker-compose.power-bomb.yaml up -d --no-build --force-recreate app
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_POWER_BOMB_FIXTURE=arena-v2-power-bomb npm --prefix e2e run test:power-bomb
      - name: Verify a full classic match and rematch using the same image
        run: |
          docker compose -f docker-compose.yaml -f docker-compose.matches.yaml up -d --no-build --force-recreate app
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_MATCH_FIXTURE=arena-v1-matches npm --prefix e2e run test:matches
          E2E_MATCH_FIXTURE=arena-v1-matches npm --prefix e2e run test:reconnect
          E2E_MATCH_FIXTURE=arena-v1-matches npm --prefix e2e run test:latency
          E2E_MATCH_FIXTURE=arena-v1-matches xvfb-run -a npm --prefix e2e run test:hardening
          npm --prefix e2e run test:controls
          xvfb-run -a npm --prefix e2e run test:audio
      - name: Scan built image for fixable high or critical vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --no-progress grenadiers-app
      - name: Stack logs
        if: failure()
        run: docker compose logs
      - name: Tear down isolated stack
        if: always()
        run: docker compose down --volumes
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/playwright-pickup-report/
            e2e/playwright-heart-report/
            e2e/playwright-shield-report/
            e2e/playwright-golden-flame-report/
            e2e/playwright-short-fuse-report/
            e2e/playwright-short-flame-report/
            e2e/playwright-long-fuse-report/
            e2e/playwright-reverse-controls-report/
            e2e/playwright-diarrhea-report/
            e2e/playwright-slow-foot-report/
            e2e/playwright-match-report/
            e2e/playwright-reconnect-report/
            e2e/playwright-controls-report/
            e2e/playwright-audio-report/
          retention-days: 7

  kubernetes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Install checksum-verified kubeconform 0.8.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tgz" \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  $RUNNER_TEMP/kubeconform.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tgz" -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: scripts/gates.sh k8s
