name: checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, same pin as Flow
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix e2e ci
      - run: scripts/gates.sh web
      - run: scripts/gates.sh e2e

  server-mask-plan:
    name: server-mask-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      source: ${{ steps.source.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Require reviewed lockfile
        run: test -s Cargo.lock
      - name: Install declared Rust toolchain
        run: rustup show
      - id: source
        name: Bind exact source
        run: |
          source='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$source"
          echo "source=$source" >> "$GITHUB_OUTPUT"
      - id: plan
        run: node scripts/ci-server-mask-plan.mjs '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-mask-plan-${{ steps.source.outputs.source }}
          path: server-mask-plan.json
          if-no-files-found: error
          retention-days: 7

  server-mask-partition:
    name: server-mask-partition (${{ matrix.index }}/${{ matrix.count }})
    needs: server-mask-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.server-mask-plan.outputs.matrix) }}
    env:
      GRENADIERS_SERVER_REPLAY_ITEM_MASK_CI_SOURCE: ${{ needs.server-mask-plan.outputs.source }}
      GRENADIERS_SERVER_REPLAY_ITEM_MASK_PARTITION_INDEX: ${{ matrix.index }}
      GRENADIERS_SERVER_REPLAY_ITEM_MASK_PARTITION_COUNT: ${{ matrix.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.server-mask-plan.outputs.source }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Set server mask report paths
        run: |
          printf '%s\n' \
            "GRENADIERS_SERVER_REPLAY_ITEM_MASK_REPORT_DIR=$RUNNER_TEMP/server-mask-report" \
            "GRENADIERS_SERVER_REPLAY_ITEM_MASK_PLAN_FILE=$RUNNER_TEMP/server-mask-plan/server-mask-plan.json" \
            >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-mask-plan-${{ needs.server-mask-plan.outputs.source }}
          path: ${{ runner.temp }}/server-mask-plan
      - name: Require exact source and reviewed lockfile
        run: |
          test "$(git rev-parse HEAD)" = "$GRENADIERS_SERVER_REPLAY_ITEM_MASK_CI_SOURCE"
          test -s Cargo.lock
      - name: Install declared Rust toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: llvm-cov-0.9.1
          cache-targets: true
          cache-workspace-crates: false
          cache-on-failure: false
          cache-bin: true
          save-if: ${{ matrix.index == 0 }}
      - name: Require cargo-llvm-cov 0.9.1
        run: |
          installed_version="$(cargo llvm-cov --version 2>/dev/null || true)"
          if [ "$installed_version" != 'cargo-llvm-cov 0.9.1' ]; then
            cargo install cargo-llvm-cov --version 0.9.1 --locked
          fi
          test "$(cargo llvm-cov --version)" = 'cargo-llvm-cov 0.9.1'
      # Repository checks only read npm manifests/locks; no npm installation is needed.
      - run: scripts/gates.sh server
      - run: scripts/gates.sh coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: server-mask-partition-${{ needs.server-mask-plan.outputs.source }}-${{ matrix.index }}
          path: ${{ runner.temp }}/server-mask-report/*.json
          if-no-files-found: error
          retention-days: 7

  server:
    name: server
    if: always()
    needs: [server-mask-plan, server-mask-partition]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require successful server mask jobs
        run: |
          test '${{ needs.server-mask-plan.result }}' = 'success'
          test '${{ needs.server-mask-partition.result }}' = 'success'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.server-mask-plan.outputs.source }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Verify aggregate source
        run: test "$(git rev-parse HEAD)" = '${{ needs.server-mask-plan.outputs.source }}'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-mask-plan-${{ needs.server-mask-plan.outputs.source }}
          path: ${{ runner.temp }}/server-mask-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-mask-partition-*
          path: ${{ runner.temp }}/server-mask-artifacts${{ fromJSON(needs.server-mask-plan.outputs.matrix).include[0].count == 1 && format('/server-mask-partition-{0}-0', needs.server-mask-plan.outputs.source) || '' }}
          merge-multiple: false
      - name: Validate complete server mask evidence
        run: node scripts/ci-server-mask-aggregate.mjs "$RUNNER_TEMP/server-mask-plan/server-mask-plan.json" "$RUNNER_TEMP/server-mask-artifacts" '${{ needs.server-mask-plan.outputs.source }}'

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: test -s Cargo.lock
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cargo-deny-0.20.2
          cache-targets: false
          cache-workspace-crates: false
          cache-on-failure: false
          cache-bin: true
      - name: Require cargo-deny 0.20.2
        run: |
          installed_version="$(cargo deny --version 2>/dev/null || true)"
          if [ "$installed_version" != 'cargo-deny 0.20.2' ]; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi
          test "$(cargo deny --version)" = 'cargo-deny 0.20.2'
      - run: scripts/gates.sh security

  browser-image:
    name: browser-image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image-id: ${{ steps.transfer.outputs.image-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: test -s Cargo.lock
      - name: Build the shared browser image
        run: docker compose build app
      - name: Scan built image for fixable high or critical vulnerabilities
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' grenadiers-app)"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --no-progress "$image_id"
      - name: Seal the image transfer artifact
        id: transfer
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          scripts/ci-image-transfer.sh prepare "$RUNNER_TEMP/browser-image" "$SOURCE_SHA" grenadiers-app
          image_id="$(docker image inspect --format '{{.Id}}' grenadiers-app)"
          echo "image-id=$image_id" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-image-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/browser-image/
          compression-level: 0
          retention-days: 1
      - name: Clean up image builder
        if: always()
        run: docker compose down --volumes --remove-orphans

  browser:
    name: browser (${{ matrix.shard }})
    needs: browser-image
    strategy:
      fail-fast: false
      matrix:
        shard: [items, classic]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Check visibility startup diagnostics contracts
        if: matrix.shard == 'classic'
        run: |
          node --test scripts/ci-browser-file-readiness.test.mjs
          node --test scripts/ci-visibility-startup-observer.test.mjs
      - name: Check browser APT mirror contract
        run: node --test scripts/ci-browser-apt-mirror.test.mjs
      - name: Prioritize the Ubuntu archive mirror
        run: sudo "$(command -v node)" scripts/ci-browser-apt-mirror.mjs /etc/apt/apt-mirrors.txt
      - run: test -s Cargo.lock
      - run: npm --prefix e2e ci
      - run: npm --prefix e2e exec -- playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-image-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/browser-image
      - name: Verify and load the sealed browser image
        env:
          EXPECTED_IMAGE_ID: ${{ needs['browser-image'].outputs['image-id'] }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/ci-image-transfer.sh load "$RUNNER_TEMP/browser-image" "$SOURCE_SHA" grenadiers-app "$EXPECTED_IMAGE_ID"
      - run: docker compose up -d --no-build
      - name: Wait for actual service readiness
        run: |
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then exit 0; fi
            sleep 1
          done
          docker compose logs app
          exit 1
      - run: scripts/gates.sh browser
        if: matrix.shard == 'items'
      - name: Verify artist export and Pixi atlas preview
        if: matrix.shard == 'items'
        run: |
          npm --prefix web ci
          scripts/gates.sh art-atlas
          scripts/gates.sh atlas-gameplay
          npm --prefix e2e run test:terrain-pixels
      - name: Verify deterministic pickups using the same built image
        if: matrix.shard == 'items'
        run: |
          GRENADIERS_FIXTURE_SEED_FILE=./core/tests/fixtures/arena-v3-pickups.seed docker compose -f docker-compose.yaml -f e2e/compose/fixture.yaml up -d --no-build --force-recreate app
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_PICKUP_FIXTURE=arena-v3-pickups npm --prefix e2e run test:pickups
      - name: Verify Heart pickup and protection using the same built image
        if: matrix.shard == 'items'
        run: |
          chmod 444 core/tests/fixtures/arena-v2-heart.seed
          GRENADIERS_FIXTURE_SEED_FILE=./core/tests/fixtures/arena-v2-heart.seed docker compose -f docker-compose.yaml -f e2e/compose/fixture.yaml up -d --no-build --force-recreate app
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_HEART_FIXTURE=arena-v3-heart npm --prefix e2e run test:heart
      - name: Verify opt-in Shield pickup and exact expiry using the same built image
        if: matrix.shard == 'items'
        run: |
          chmod 444 core/tests/fixtures/arena-v2-shield.seed
          GRENADIERS_FIXTURE_SEED_FILE=./core/tests/fixtures/arena-v2-shield.seed docker compose -f docker-compose.yaml -f e2e/compose/fixture.yaml up -d --no-build --force-recreate app
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_SHIELD_FIXTURE=arena-v3-shield npm --prefix e2e run test:shield
      - name: Verify opt-in Golden Flame range and exact expiry using the same built image
        if: matrix.shard == 'items'
        run: |
          chmod 444 core/tests/fixtures/arena-v2-golden-flame.seed
          GRENADIERS_FIXTURE_SEED_FILE=./core/tests/fixtures/arena-v2-golden-flame.seed docker compose -f docker-compose.yaml -f e2e/compose/fixture.yaml up -d --no-build --force-recreate app
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_GOLDEN_FLAME_FIXTURE=arena-v3-golden-flame npm --prefix e2e run test:golden-flame
      - name: Verify opt-in Short Fuse timing and exact expiry using the same built image
        if: matrix.shard == 'items'
        run: |
          chmod 444 core/tests/fixtures/arena-v2-short-fuse.seed
          GRENADIERS_FIXTURE_SEED_FILE=./core/tests/fixtures/arena-v2-short-fuse.seed docker compose -f docker-compose.yaml -f e2e/compose/fixture.yaml up -d --no-build --force-recreate app
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_SHORT_FUSE_FIXTURE=arena-v3-short-fuse npm --prefix e2e run test:short-fuse
      - name: Verify opt-in Short Flame range and exact expiry using the same built image
        if: matrix.shard == 'items'
        run: |
          chmod 444 core/tests/fixtures/arena-v2-short-flame.seed
          GRENADIERS_FIXTURE_SEED_FILE=./core/tests/fixtures/arena-v2-short-flame.seed docker compose -f docker-compose.yaml -f e2e/compose/fixture.yaml up -d --no-build --force-recreate app
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_SHORT_FLAME_FIXTURE=arena-v3-short-flame npm --prefix e2e run test:short-flame
      - name: Verify opt-in Long Fuse timing and exact expiry using the same built image
        if: matrix.shard == 'items'
        run: |
          chmod 444 core/tests/fixtures/arena-v2-long-fuse.seed
          GRENADIERS_FIXTURE_SEED_FILE=./core/tests/fixtures/arena-v2-long-fuse.seed docker compose -f docker-compose.yaml -f e2e/compose/fixture.yaml up -d --no-build --force-recreate app
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_LONG_FUSE_FIXTURE=arena-v3-long-fuse npm --prefix e2e run test:long-fuse
      - name: Verify opt-in Reverse Controls inversion and exact expiry using the same built image
        if: matrix.shard == 'items'
        run: |
          chmod 444 core/tests/fixtures/arena-v2-reverse-controls.seed
          GRENADIERS_FIXTURE_SEED_FILE=./core/tests/fixtures/arena-v2-reverse-controls.seed docker compose -f docker-compose.yaml -f e2e/compose/fixture.yaml up -d --no-build --force-recreate app
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_REVERSE_CONTROLS_FIXTURE=arena-v3-reverse-controls npm --prefix e2e run test:reverse-controls
      - name: Verify opt-in Diarrhea automatic bomb placement using the same built image
        if: matrix.shard == 'items'
        run: |
          chmod 444 core/tests/fixtures/arena-v2-diarrhea.seed
          GRENADIERS_FIXTURE_SEED_FILE=./core/tests/fixtures/arena-v2-diarrhea.seed docker compose -f docker-compose.yaml -f e2e/compose/fixture.yaml up -d --no-build --force-recreate app
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_DIARRHEA_FIXTURE=arena-v3-diarrhea npm --prefix e2e run test:diarrhea
      - name: Verify opt-in Slow foot movement and exact expiry using the same built image
        if: matrix.shard == 'items'
        run: |
          chmod 444 core/tests/fixtures/arena-v2-slow-foot.seed
          GRENADIERS_FIXTURE_SEED_FILE=./core/tests/fixtures/arena-v2-slow-foot.seed docker compose -f docker-compose.yaml -f e2e/compose/fixture.yaml up -d --no-build --force-recreate app
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_SLOW_FOOT_FIXTURE=arena-v3-slow-foot npm --prefix e2e run test:slow-foot
      - name: Verify opt-in Piercing Bomb penetration using the same built image
        if: matrix.shard == 'items'
        run: |
          chmod 444 core/tests/fixtures/arena-v2-piercing-bomb.seed
          GRENADIERS_FIXTURE_SEED_FILE=./core/tests/fixtures/arena-v2-piercing-bomb.seed docker compose -f docker-compose.yaml -f e2e/compose/fixture.yaml up -d --no-build --force-recreate app
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_PIERCING_BOMB_FIXTURE=arena-v3-piercing-bomb npm --prefix e2e run test:piercing-bomb
      - name: Verify opt-in Power Bomb hard-wall traversal using the same built image
        if: matrix.shard == 'items'
        run: |
          chmod 444 core/tests/fixtures/arena-v2-power-bomb.seed
          GRENADIERS_FIXTURE_SEED_FILE=./core/tests/fixtures/arena-v2-power-bomb.seed docker compose -f docker-compose.yaml -f e2e/compose/fixture.yaml up -d --no-build --force-recreate app
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_POWER_BOMB_FIXTURE=arena-v3-power-bomb npm --prefix e2e run test:power-bomb
      - name: Verify opt-in Remote Bomb command detonation using the same built image
        if: matrix.shard == 'items'
        run: |
          chmod 444 core/tests/fixtures/arena-v2-remote-bomb.seed
          GRENADIERS_FIXTURE_SEED_FILE=./core/tests/fixtures/arena-v2-remote-bomb.seed docker compose -f docker-compose.yaml -f e2e/compose/fixture.yaml up -d --no-build --force-recreate app
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_REMOTE_BOMB_FIXTURE=arena-v3-remote-bomb npm --prefix e2e run test:remote-bomb
      - name: Verify opt-in Landmine contact detonation using the same built image
        if: matrix.shard == 'items'
        run: |
          chmod 444 core/tests/fixtures/arena-v2-landmine.seed
          GRENADIERS_FIXTURE_SEED_FILE=./core/tests/fixtures/arena-v2-landmine.seed docker compose -f docker-compose.yaml -f e2e/compose/fixture.yaml up -d --no-build --force-recreate app
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_LANDMINE_FIXTURE=arena-v3-landmine npm --prefix e2e run test:landmine
      - name: Verify opt-in Invisibility Cloak recipient privacy using the same built image
        if: matrix.shard == 'items'
        run: |
          chmod 444 core/tests/fixtures/arena-v2-invisibility-cloak.seed
          GRENADIERS_FIXTURE_SEED_FILE=./core/tests/fixtures/arena-v2-invisibility-cloak.seed docker compose -f docker-compose.yaml -f e2e/compose/fixture.yaml up -d --no-build --force-recreate app
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/api/v1/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8085/api/v1/ready
          E2E_INVISIBILITY_CLOAK_FIXTURE=arena-v3-invisibility-cloak npm --prefix e2e run test:invisibility-cloak
