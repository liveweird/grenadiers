[workspace]
members = ["core", "server"]
resolver = "3"

[workspace.package]
version = "0.3.81"
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
# Exact: entropy API/platform changes affect credentials, room identity and private round seeds.
getrandom = "=0.3.4"
grenadiers-core = { path = "core", version = "=0.3.81" }
http-body-util = "0.1"
jsonschema = { version = "0.33", default-features = false }
# Exact: the ChaCha20 word stream is part of versioned arena generation and replay compatibility.
rand_chacha = "=0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = "symbols"

[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true

