name: grenadiers
services:
  app:
    build: .
    ports:
      - '127.0.0.1:8085:8085'
    environment:
      SERVER_ADDR: '0.0.0.0:8085'
      WEB_DIST_DIR: '/app/web/dist'
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-http://localhost:8085,http://127.0.0.1:8085}'
      RUST_LOG: '${RUST_LOG:-grenadiers_server=info,tower_http=info}'
      # Set a Compose-network URL explicitly to opt into database readiness.
      DATABASE_URL: '${DATABASE_URL:-}'
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    stop_grace_period: 10s
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    profiles: [persistence]
    ports:
      - '127.0.0.1:5436:5432'
    environment:
      POSTGRES_DB: grenadiers
      POSTGRES_USER: grenadiers
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-grenadiers_local_only}'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U grenadiers -d grenadiers']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
