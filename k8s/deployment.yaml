apiVersion: apps/v1
kind: Deployment
metadata:
  name: grenadiers
  labels:
    app.kubernetes.io/name: grenadiers
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grenadiers
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grenadiers
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: grenadiers-app:local
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVER_ADDR
              value: 0.0.0.0:8085
            - name: WEB_DIST_DIR
              value: /app/web/dist
            - name: ALLOWED_ORIGINS
              value: http://localhost:8085,http://127.0.0.1:8085
            - name: DATABASE_URL
              value: ""
            - name: RUST_LOG
              value: grenadiers_server=info,tower_http=info
            - name: TRUSTED_PROXY_IPS
              value: ""
          ports:
            - name: http
              containerPort: 8085
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
