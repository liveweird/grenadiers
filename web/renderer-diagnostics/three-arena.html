<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="grenadiers-build-target" content="grenadiers-three-arena-diagnostic">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'none'; media-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Grenadiers Three arena diagnostic</title>
    <style>
      :root { color: #f5efdc; background: #10191e; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-width: 0; }
      main { width: 100%; padding: 20px; }
      h1 { margin: 0 0 6px; font-size: 1.45rem; }
      p { margin: 0 0 16px; color: #cbd7d6; }
      #arena { width: min(920px, 100%); aspect-ratio: 15 / 13; min-height: 240px; }
      #arena canvas { border: 1px solid #43545b; }
      @media (max-width: 480px) { main { padding: 8px; } h1 { font-size: 1.1rem; } }
    </style>
  </head>
  <body>
    <main data-build-target="grenadiers-three-arena-diagnostic">
      <h1>Native Three arena diagnostic</h1>
      <p>Credential-free public snapshots rendered by the production R3F factory.</p>
      <div id="arena" role="img" aria-label="Synthetic Grenadiers Three.js arena"></div>
    </main>
    <script type="module" src="/three-arena.ts"></script>
  </body>
</html>
